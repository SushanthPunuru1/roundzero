# RoundZero — Networking quiz bank: security
# Location in repo: packages/content/networking-quiz/security.yaml
# Contract: packages/content/networking-quiz/README.md

version: 1
quizId: networking

questions:
  - id: networking-quiz.q.enable-secret-vs-password
    category: security
    skillNodeId: networking.devices.hardening
    prompt: "enable secret and enable password both set a privileged-mode password. When both are configured, which one does IOS actually use?"
    answer: "enable secret"
    accepts: ["enable secret"]
    why: "enable password is stored in plaintext — readable straight out of running-config. IOS always prefers the hashed enable secret when both exist."

  - id: networking-quiz.q.telnet-vs-ssh
    category: security
    skillNodeId: networking.devices.hardening
    prompt: "Between Telnet and SSH, which should be used for remote device administration?"
    answer: "ssh"
    accepts: ["ssh"]
    why: "Telnet has no encryption at all — anyone on the path can read the login password, including the password itself. SSH encrypts the entire session."

  - id: networking-quiz.q.password-encryption-command
    category: security
    skillNodeId: networking.devices.hardening
    prompt: "What command obfuscates every plaintext password already in the running config?"
    answer: "service password-encryption"
    accepts: ["service password-encryption"]
    why: "It applies IOS's reversible type-7 obfuscation to plaintext passwords — worth doing, but not real cryptographic protection (that's what enable secret's hashing is for)."

  - id: networking-quiz.q.wireless-security-standard
    category: security
    skillNodeId: networking.wireless.security
    prompt: "Which wireless security standard should be used instead of the deprecated, easily-broken WEP?"
    answer: "wpa2"
    accepts: ["wpa2", "wpa3", "wpa2 or wpa3"]
    why: "WEP's encryption is broken and crackable in minutes. WPA2 (or the newer WPA3) should always be used instead."

  - id: networking-quiz.q.banner-purpose
    category: security
    skillNodeId: networking.devices.hardening
    prompt: "What is displayed by a login banner (banner motd) on a hardened network device?"
    answer: "a legal warning"
    accepts: ["a legal warning", "legal warning", "a legal notice", "legal notice"]
    why: "A banner isn't decoration — it's a legal warning notice against unauthorized access, and its absence is a scored hardening finding in CyberPatriot-style scenarios."

  - id: networking-quiz.q.ssh-requires
    category: security
    skillNodeId: networking.devices.hardening
    prompt: "Before SSH can be enabled on a Cisco device, what must be configured besides a hostname?"
    answer: "a domain name"
    accepts: ["a domain name", "domain name", "ip domain-name", "domain-name"]
    why: "The hostname and domain name together form the fully-qualified name the RSA key pair is generated against, so `crypto key generate rsa` fails without both."

  - id: networking-quiz.q.vty-login-local
    category: security
    skillNodeId: networking.devices.hardening
    prompt: "Which line-configuration command makes VTY lines authenticate against the device's own username database?"
    answer: "login local"
    accepts: ["login local"]
    why: "`login local` checks the locally configured usernames; plain `login` only checks a shared line password. Local accounts mean each administrator authenticates as themselves."

  - id: networking-quiz.q.port-security
    category: security
    skillNodeId: networking.devices.hardening
    prompt: "What switch feature limits which MAC addresses may use an access port?"
    answer: "port security"
    accepts: ["port security", "switchport port-security"]
    why: "Port security caps how many MAC addresses a port accepts and can pin it to specific ones, so an unauthorized device plugged into a wall jack is shut out."

  - id: networking-quiz.q.shutdown-unused
    category: security
    skillNodeId: networking.devices.hardening
    prompt: "What should be done with switch ports that are not in use?"
    answer: "shut them down"
    accepts: ["shut them down", "shutdown", "disable them", "shut down"]
    why: "An enabled unused port is a live network jack anyone can plug into. Shutting unused ports down — and placing them in an unused VLAN — is standard hardening and is scored."

  - id: networking-quiz.q.wps-weakness
    category: security
    skillNodeId: networking.wireless.security
    prompt: "Which wireless feature should be disabled because its PIN can be brute-forced regardless of passphrase strength?"
    answer: "wps"
    accepts: ["wps", "wi-fi protected setup", "wifi protected setup"]
    why: "The WPS PIN is eight digits and is validated in two halves, so it falls in hours and hands over the passphrase. A 20-character passphrase does not help if there is a second door."
